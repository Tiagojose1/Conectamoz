<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="400">
  <defs>
    <!-- Gradiente Metálico Dourado Principal -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE885" />
      <stop offset="30%" stop-color="#D4AF37" />
      <stop offset="50%" stop-color="#FFF1B8" />
      <stop offset="70%" stop-color="#AA7C11" />
      <stop offset="100%" stop-color="#543A02" />
    </linearGradient>

    <!-- Gradiente para o Fundo Interno -->
    <radialGradient id="innerBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE066" />
      <stop offset="60%" stop-color="#C59B27" />
      <stop offset="100%" stop-color="#684A0A" />
    </radialGradient>

    <!-- Sombra e Brilho do Relevo -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="5" stdDeviation="4" flood-color="#000" flood-opacity="0.6"/>
    </filter>

    <!-- Caminho Circular para o Texto Curvado -->
    <path id="textCircle" d="M 250, 250 m -185, 0 a 185,185 0 1,1 370,0 a 185,185 0 1,1 -370,0" />
  </defs>

  <!-- Sombra Projetada da Moeda -->
  <ellipse cx="250" cy="460" rx="200" ry="25" fill="#000" opacity="0.4" filter="blur(10px)" />

  <!-- Borda Externa Dourada -->
  <circle cx="250" cy="250" r="230" fill="url(#goldGrad)" filter="url(#shadow)" />

  <!-- Anel Serrilhado da Borda -->
  <circle cx="250" cy="250" r="218" fill="none" stroke="#543A02" stroke-width="4" stroke-dasharray="8 6" opacity="0.7" />

  <!-- Anel do Texto -->
  <circle cx="250" cy="250" r="205" fill="#1A1003" stroke="url(#goldGrad)" stroke-width="3" />

  <!-- Texto ao Redor da Borda: KONNEXVIB • MOÇAMBIQUE -->
  <text fill="url(#goldGrad)" font-size="22" font-weight="900" font-family="Arial, sans-serif" letter-spacing="4">
    <textPath href="#textCircle" startOffset="50%" text-anchor="middle">
      KONNEXVIB  •  MOÇAMBIQUE  •
    </textPath>
  </text>

  <!-- Anel Interno em Relevo -->
  <circle cx="250" cy="250" r="155" fill="url(#innerBg)" stroke="url(#goldGrad)" stroke-width="8" filter="url(#shadow)" />

  <!-- Detalhe do Circuito / Linhas Tecnológicas Internas -->
  <circle cx="250" cy="250" r="140" fill="none" stroke="#FFE885" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.5" />

  <!-- Sigla KV Central em 3D Relevo -->
  <!-- Sombra 3D -->
  <text x="253" y="293" text-anchor="middle" fill="#3B2603" font-size="130" font-weight="900" font-family="Impact, Arial Black, sans-serif" letter-spacing="-2">
    KV
  </text>
  <!-- Texto Dourado Brilhante -->
  <text x="250" y="290" text-anchor="middle" fill="url(#goldGrad)" stroke="#FFF1B8" stroke-width="2" font-size="130" font-weight="900" font-family="Impact, Arial Black, sans-serif" letter-spacing="-2" filter="url(#shadow)">
    KV
  </text>
</svg>
